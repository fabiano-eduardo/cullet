name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and registry drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Require a changeset on pull requests
        if: github.event_name == 'pull_request'
        run: npx changeset status --since=origin/${{ github.base_ref }}

      - name: Prettier (changed files)
        if: github.event_name == 'pull_request'
        env:
          FORMAT_BASE_REF: origin/${{ github.base_ref }}
        run: npm run format:check:changed

      - name: Prettier (changed files)
        if: github.event_name != 'pull_request'
        env:
          FORMAT_BASE_REF: ${{ github.event.before }}
        run: npm run format:check:changed

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Validate kits
        run: npm run validate-kits

      - name: Verify kit peerDependencies are in sync
        run: npm run sync-kit-deps:check

  test:
    name: Test (Node ${{ matrix.node }} on ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build (required for e2e)
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: E2E smoke tests
        run: npm run test:e2e

  test-kits:
    name: Kit unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Kit unit tests (kits/**/*.spec.ts)
        run: npm run test:kits

  pack:
    name: Release dry run
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify publishable tarball
        run: npm run release:dry-run

name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Validate kits
        run: npm run validate-kits

      - name: Verify kit peerDependencies are in sync
        run: npm run sync-kit-deps:check

      - name: Verify kit version constants are in sync
        run: npm run sync-kit-version:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: E2E smoke tests
        run: npm run test:e2e

      - name: Kit unit tests
        run: npm run test:kits

      - name: Validate publishable tarballs (workspace)
        run: npm run release:dry-run

      - name: Create release PR or publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "chore: release cullet"
          title: "chore: release cullet"
          version: npm run changeset:version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
